name: cabane-login

services:
  telemetry-ws-server:
    image: franciscolkdo/telemetry-ws-server:latest
    user: "0:0"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://ma-cabane.challenges.bnctf.com}
      ADMIN_TOKEN: ${TELEMETRY_ADMIN_TOKEN:-ctf-poc-change-me}
      POPUP_DELAY_MS: ${POPUP_DELAY_MS:-3000}
      POPUP_TEXT: ${POPUP_TEXT:-Votre session a expiré. Rechargez la page.}
      USERNAME_STOLEN: ${LOGIN_USERNAME}
      PASSWORD_STOLEN: ${LOGIN_PASSWORD}
    networks:
      - login
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      start_period: 30s
      start_interval: 3s
      interval: 10m
      timeout: 3s
      retries: 12
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    entrypoint: ["/bin/sh", "/etc/caddy/entrypoint.sh"]
    volumes:
      - ${TLS_CERTS_SOURCE:-./certs}:/certs:ro
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/Caddyfile.provided-certs:/etc/caddy/Caddyfile.provided-certs:ro
      - ./caddy/entrypoint.sh:/etc/caddy/entrypoint.sh:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${TELEMETRY_HTTPS_PORT:-443}:443"
    networks:
      login:
        aliases: # for github-runner to reach the caddy service
          - telemetricks.challenges.bnctf.com
          - ma-cabane.challenges.bnctf.com
    depends_on:
      telemetry-ws-server:
        condition: service_healthy
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    image: franciscolkdo/ma-cabane-backend
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      LOGIN_USERNAME: ${LOGIN_USERNAME:?Set LOGIN_USERNAME in login-stack/.env}
      LOGIN_PASSWORD: ${LOGIN_PASSWORD:?Set LOGIN_PASSWORD in login-stack/.env}
      LOGIN_FLAG: ${LOGIN_FLAG:?Set LOGIN_FLAG in login-stack/.env}
      LOGIN_RATE_LIMIT_MAX_ATTEMPTS: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:-5}
      LOGIN_RATE_LIMIT_WINDOW_MS: ${LOGIN_RATE_LIMIT_WINDOW_MS:-900000}
    networks:
      - login
    restart: unless-stopped

  github-runner:
    image: franciscolkdo/github-runner:latest
    environment:
      RUNNER_REPOSITORY_URL: ${RUNNER_REPOSITORY_URL:-https://github.com/franciscoLKDO/ma-cabane-a-sucre}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      GH_TOKEN: ${GH_TOKEN:-}
      RUNNER_NAME: ${RUNNER_NAME:-ma-cabane-a-sucre-runner}
      RUNNER_LABELS: ${RUNNER_LABELS:-cabane-release}
      RUNNER_EPHEMERAL: ${RUNNER_EPHEMERAL:-false}
      TELEMETRY_CA_PATH: /certs/ca-cert.pem
      NODE_EXTRA_CA_CERTS: /certs/ca-cert.pem
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${TLS_CERTS_SOURCE:-./certs}:/certs:ro
    profiles:
      - runner
    networks:
      - login
    depends_on:
      caddy:
        condition: service_healthy
    restart: "no"

networks:
  login:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
